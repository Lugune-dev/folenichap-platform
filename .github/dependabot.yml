# Opens pull requests automatically when a dependency has a security fix or a new version.
# Enable "Dependabot alerts" and "Dependabot security updates" in GitHub -> Settings -> Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend-angular
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]

  - package-ecosystem: maven
    directory: /backend-spring
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /backend-spring
    schedule: { interval: monthly }

  - package-ecosystem: docker
    directory: /frontend-angular
    schedule: { interval: monthly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
