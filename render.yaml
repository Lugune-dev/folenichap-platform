# Render Blueprint: the Spring Boot API only (the Angular app is on Vercel, see frontend-angular/vercel.json).
# Render dashboard -> New -> Blueprint -> pick this repo. Values marked `sync: false` are asked for once.
services:
  - type: web
    name: folenichap-api
    runtime: docker
    plan: free
    region: frankfurt                 # keep it next to the Neon database (create Neon in eu-central-1 too)
    dockerfilePath: ./backend-spring/Dockerfile
    dockerContext: ./backend-spring
    healthCheckPath: /actuator/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend-spring/**
        - render.yaml
    envVars:
      - key: PORT
        value: "8080"
      # Free instance has 512 MB: small heap, serial GC, capped metaspace/threads.
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:MaxMetaspaceSize=150m -XX:ReservedCodeCacheSize=48m -Xss512k -XX:TieredStopAtLevel=1 -Duser.timezone=UTC"

      # ---- Database (Neon) ----
      - key: DB_URL                   # jdbc:postgresql://ep-xxx-pooler.eu-central-1.aws.neon.tech/neondb?sslmode=require
        sync: false
      - key: DB_MIGRATION_URL         # same URL without "-pooler" (direct connection for Flyway)
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "5"

      # ---- Public URLs (your Vercel address, e.g. https://folenichap.vercel.app) ----
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # ---- Security ----
      - key: JWT_SECRET               # 256-bit base64, generated by Render
        generateValue: true
      - key: PROXY_SHARED_SECRET      # openssl rand -hex 24 ; put the SAME value in Vercel
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: API_DOCS_ENABLED
        value: "false"

      # ---- Payments: AzamPay (see AZAMPAY_SETUP.md) ----
      # AzamPay callback URL (set in the AzamPay portal):
      #   https://<app>.vercel.app/api/v1/webhooks/payments/azampay?token=<PAYMENT_WEBHOOK_SECRET>
      - key: PAYMENT_GATEWAY
        value: AZAMPAY
      - key: ALLOW_MOCK_PAYMENTS
        value: "false"
      - key: PAYMENT_WEBHOOK_SECRET   # openssl rand -hex 24
        sync: false
      - key: AZAMPAY_APP_NAME         # app name exactly as registered in the AzamPay developer portal
        sync: false
      - key: AZAMPAY_CLIENT_ID
        sync: false
      - key: AZAMPAY_CLIENT_SECRET
        sync: false
      - key: AZAMPAY_API_KEY          # optional: the portal's API key / token, sent as X-API-Key
        sync: false
      - key: AZAMPAY_AUTH_URL         # sandbox https://authenticator-sandbox.azampay.co.tz | live https://authenticator.azampay.co.tz
        sync: false
      - key: AZAMPAY_CHECKOUT_URL     # sandbox https://sandbox.azampay.co.tz | live https://checkout.azampay.co.tz
        sync: false
      - key: PAYMENT_WEBHOOK_ALLOWED_IPS  # optional: AzamPay callback IPs, comma separated
        sync: false
