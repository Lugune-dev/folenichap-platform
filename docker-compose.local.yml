# Offline development only: local Postgres instead of the online DB.
#   docker compose -f docker-compose.local.yml up -d
#   cd backend-spring && SPRING_PROFILES_ACTIVE=local mvn spring-boot:run
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: folenichap
      POSTGRES_USER: foleni_admin
      POSTGRES_PASSWORD: foleni
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pg_data:
