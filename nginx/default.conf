# FoleniChap reverse proxy: Angular SPA + Spring Boot API + SSE
# TLS certificates are issued by certbot (see scripts/init-letsencrypt.sh).

limit_req_zone $binary_remote_addr zone=public_api:10m rate=20r/s;

upstream backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN} www.${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # --- Server-Sent Events: no buffering, long timeouts ---
    location ~ ^/api/v1/public/tenants/[^/]+/stream$ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: never trust a client-sent value
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/v1/public/ {
        limit_req zone=public_api burst=40 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: never trust a client-sent value
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(api|actuator/health) {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: never trust a client-sent value
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # PWA control files: must always be re-checked, otherwise phones get stuck on an old version.
    # (Listed before the static-asset rule below, which would otherwise cache ngsw-worker.js for a year.)
    location ~ ^/(ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|ngsw\.json|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # hashed static assets: cache forever
    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # SPA fallback (/b/{slug}, /t/{token}, /tv/{slug}, /desk, /admin ...)
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
