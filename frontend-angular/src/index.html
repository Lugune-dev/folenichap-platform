  <!-- Splash screen: pure CSS (the CSP allows inline styles, not inline scripts). main.ts fades it out
       once the first page has rendered. Same navy as the PWA manifest so installed-app launch is seamless. -->
  <style>
    #fc-splash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;
      background:radial-gradient(42rem 28rem at 85% 110%,rgba(32,154,112,.35),transparent 62%),radial-gradient(30rem 22rem at 0% 0%,rgba(32,154,112,.12),transparent 60%),#0b1828;
      color:#fff;font-family:"Inter Variable",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .45s ease,visibility .45s ease}
    #fc-splash.fc-splash-hide{opacity:0;visibility:hidden}
    .fc-splash-mark{position:relative;width:76px;height:76px}
    .fc-splash-mark svg{position:relative;z-index:1;display:block;width:76px;height:76px;filter:drop-shadow(0 12px 28px rgba(0,0,0,.35))}
    .fc-splash-mark::before,.fc-splash-mark::after{content:"";position:absolute;inset:0;border-radius:22px;border:2px solid rgba(69,180,139,.55);animation:fc-ring 2.2s cubic-bezier(.2,.6,.3,1) infinite}
    .fc-splash-mark::after{animation-delay:1.1s}
    .fc-splash-line{transform-origin:9px 0;animation:fc-line 1.6s ease-in-out infinite}
    .fc-splash-line.l2{animation-delay:.18s}.fc-splash-line.l3{animation-delay:.36s}
    .fc-splash-dot{animation:fc-dot 1.6s ease-in-out infinite}
    .fc-splash-name{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:-.02em}
    .fc-splash-name span{color:#7ccfae}
    .fc-splash-bar{width:132px;height:3px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
    .fc-splash-bar i{display:block;width:40%;height:100%;border-radius:inherit;background:linear-gradient(90deg,transparent,#45b48b,#7ccfae);animation:fc-bar 1.15s ease-in-out infinite}
    .fc-splash-text{margin:0;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5)}
    @keyframes fc-ring{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.75);opacity:0}}
    @keyframes fc-line{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.55)}}
    @keyframes fc-dot{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
    @keyframes fc-bar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
    @media (prefers-reduced-motion:reduce){#fc-splash *,#fc-splash *::before,#fc-splash *::after{animation:none!important}}
  </style>
</head>
<body>
  <div id="fc-splash" role="status" aria-live="polite">
    <div class="fc-splash-mark">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#0f6549"/>
        <g stroke="#fff" stroke-width="2.6" stroke-linecap="round">
          <path class="fc-splash-line" d="M9 10.5h14"/><path class="fc-splash-line l2" d="M9 16h10"/><path class="fc-splash-line l3" d="M9 21.5h6"/>
        </g>
        <circle class="fc-splash-dot" cx="22.5" cy="21.5" r="3" fill="#45b48b"/>
      </svg>
    </div>
    <p class="fc-splash-name">Foleni<span>Chap</span></p>
    <div class="fc-splash-bar"><i></i></div>
    <p class="fc-splash-text">Inafunguka · Loading</p>
  </div>
  <fc-root></fc-root>
  <noscript>FoleniChap inahitaji JavaScript. / FoleniChap needs JavaScript enabled.</noscript>
</body>
